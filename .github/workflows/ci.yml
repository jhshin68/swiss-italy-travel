# ci.yml — CI/CD 파이프라인
# 트리거: main 브랜치 push / PR → CI 실행
#         main 브랜치 push → Vercel 배포 (프론트) + Oracle VM 배포 (백엔드)

name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# 동시 배포 방지 — 같은 ref에서 이전 실행이 있으면 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: 프론트엔드 린트 + 타입 체크
  # ─────────────────────────────────────────────
  frontend-check:
    name: 🖥 Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .   # 루트 (Next.js)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  # ─────────────────────────────────────────────
  # JOB 2: 백엔드 린트 + 타입 체크 + 마이그레이션 검증
  # ─────────────────────────────────────────────
  backend-check:
    name: 🔧 Backend — Lint & Type Check & Migrate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run migration (smoke test)
        env:
          DB_PATH: /tmp/test-travel.db
          NODE_ENV: test
        run: npm run migrate

      - name: Verify health endpoint (build check)
        run: npm run build

  # ─────────────────────────────────────────────
  # JOB 3: Vercel 프론트엔드 배포
  #   main 브랜치 push 시에만 실행
  #   Vercel은 GitHub 연동 자동배포도 가능하나,
  #   Actions로 명시적 제어한다.
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: 🚀 Deploy — Vercel (Frontend)
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # ─────────────────────────────────────────────
  # JOB 4: Oracle VM 백엔드 배포
  #   SSH로 VM에 접속해 git pull + npm ci + 재시작
  # ─────────────────────────────────────────────
  deploy-backend:
    name: 🔧 Deploy — Oracle VM (Backend)
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "📦 소스 업데이트..."
            cd ~/swiss-italy-travel
            git fetch origin main
            git reset --hard origin/main

            echo "📦 백엔드 의존성 설치..."
            cd backend
            npm ci --production=false

            echo "🔨 빌드..."
            npx tsc

            echo "🔄 PM2 재시작..."
            pm2 restart swiss-travel-api || pm2 start dist/index.js --name swiss-travel-api

            echo "✅ 배포 완료"
            pm2 status swiss-travel-api

      - name: Health check after deploy
        run: |
          sleep 5
          curl -f https://slp-travel.duckdns.org/api/health || exit 1
